<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CampusMate AI - Your campus, connected.</title>
  <meta name="description" content="CampusMate AI: an intelligent student support platform for academic information, student services and campus assistance at AIDTM.">
  <meta name="theme-color" content="#111C35">
  <link rel="icon" type="image/svg+xml" href="/static/logo.svg">
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<div id="app"></div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<!-- ============ login ============ -->
<template id="tpl-login">
  <section class="login" aria-labelledby="login-title">
    <div class="login-card">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <div>
          <h1 id="login-title" class="brand-name">CampusMate AI</h1>
          <p class="tagline">Your campus, connected.</p>
        </div>
      </div>
      <p class="login-desc">An intelligent student support platform for academic information, student services and campus assistance.</p>
      <form id="login-form" novalidate>
        <label class="field"><span>Student ID or staff username</span>
          <input id="login-user" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required></label>
        <label class="field"><span>Password</span>
          <span class="pw">
            <input id="login-pass" name="password" type="password" autocomplete="current-password" required>
            <button type="button" id="pw-toggle" class="btn btn-ghost" aria-pressed="false" aria-label="Show password">Show</button>
          </span></label>
        <p id="login-error" class="error" role="alert" hidden></p>
        <button class="btn btn-primary btn-block" type="submit" id="login-submit">Sign in</button>
      </form>
      <details id="demo" class="demo" hidden>
        <summary>Development demo accounts</summary>
        <p class="muted">Fictional accounts for local development only. Click one to fill the form.</p>
        <div id="demo-list" class="demo-list"></div>
      </details>
    </div>
    <p class="foot">AIDTM &ndash; Adani Institute of Digital Technology Management &middot; PGDM Batch 2025-27</p>
  </section>
</template>

<!-- ============ student workspace ============ -->
<template id="tpl-student">
  <div class="shell">
    <header class="topbar">
      <button id="btn-menu" class="btn btn-ghost only-mobile" aria-label="Show conversations">Menu</button>
      <div class="brand brand-small"><span class="brand-mark" aria-hidden="true"></span><span class="brand-name">CampusMate AI</span></div>
      <nav class="topbar-right" aria-label="Account">
        <span id="provider-pill" class="pill pill-quiet" hidden></span>
        <button id="btn-requests" class="btn btn-ghost">My requests <span id="req-count" class="badge" hidden></span></button>
        <button id="btn-profile" class="btn btn-ghost">Profile &amp; memory</button>
        <button id="btn-logout" class="btn btn-ghost">Sign out</button>
      </nav>
    </header>
    <div class="columns">
      <aside id="sidebar" class="sidebar" aria-label="Conversations">
        <button id="btn-new" class="btn btn-primary btn-block">+ New conversation</button>
        <div class="who"><div class="avatar" id="avatar" aria-hidden="true"></div><div><div id="who-name" class="who-name"></div><div id="who-meta" class="muted small"></div></div></div>
        <h2 class="side-title">Conversations</h2>
        <ul id="conv-list" class="conv-list"></ul>
        <p id="conv-empty" class="muted small" hidden>No conversations yet.</p>
      </aside>
      <main id="main" class="chat" tabindex="-1">
        <div id="messages" class="messages" role="log" aria-live="polite" aria-label="Conversation"></div>
        <div id="status" class="status" role="status" aria-live="polite" hidden></div>
        <div id="error-bar" class="errorbar" role="alert" hidden><span id="error-text"></span><button id="btn-retry" class="btn btn-small" hidden>Retry</button></div>
        <form id="chat-form" class="composer">
          <label class="sr" for="chat-input">Message</label>
          <textarea id="chat-input" rows="1" maxlength="2000" placeholder="Ask about your fees, scholarship, policies, exams... (Enter to send, Shift+Enter for a new line)" required></textarea>
          <button class="btn btn-primary" type="submit" id="btn-send">Send</button>
        </form>
      </main>
    </div>
    <div id="modal" class="modal" hidden>
      <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <div class="modal-head"><h2 id="modal-title"></h2><button id="modal-close" class="btn btn-ghost" aria-label="Close">Close</button></div>
        <div id="modal-body" class="modal-body"></div>
      </div>
    </div>
  </div>
</template>

<!-- ============ staff / admin workspace ============ -->
<template id="tpl-staff">
  <div class="shell">
    <header class="topbar">
      <div class="brand brand-small"><span class="brand-mark" aria-hidden="true"></span><span class="brand-name">CampusMate AI</span><span id="role-pill" class="pill pill-teal"></span></div>
      <nav class="topbar-right" aria-label="Account"><span id="staff-name" class="muted"></span><button id="btn-logout" class="btn btn-ghost">Sign out</button></nav>
    </header>
    <main id="main" class="dash" tabindex="-1">
      <div id="metrics" class="metrics" aria-label="Key numbers"></div>
      <div class="tabs" role="tablist" id="tabs"></div>
      <section id="panel" class="panel" role="tabpanel"></section>
    </main>
  </div>
</template>
<script src="/static/app.js" defer></script>
</body>
</html>
